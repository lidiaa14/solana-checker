<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solana Phrase Checker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tweetnacl/1.0.3/nacl-fast.min.js"></script>
<style>
:root {
  --bg:       #0f0f0f;
  --surface:  #1a1a1a;
  --border:   #2a2a2a;
  --accent:   #9945ff;
  --green:    #14f195;
  --red:      #ff4444;
  --text:     #e8e8e8;
  --muted:    #666;
  --radius:   8px;
  --mono:     'Courier New', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--mono); min-height: 100vh; padding: 1.5rem 1rem; }
h1 { font-size: 18px; color: var(--accent); margin-bottom: 4px; letter-spacing: 1px; }
.sub { font-size: 11px; color: var(--muted); margin-bottom: 1.5rem; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; margin-bottom: 1rem; }
.label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
textarea, input, select {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); font-family: var(--mono);
  font-size: 13px; padding: 8px 10px; outline: none;
}
textarea { resize: vertical; min-height: 70px; }
textarea:focus, input:focus, select:focus { border-color: var(--accent); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
button {
  width: 100%; padding: 10px; border-radius: var(--radius); border: 1px solid var(--border);
  background: transparent; color: var(--text); font-family: var(--mono); font-size: 13px;
  cursor: pointer; transition: all .15s;
}
button:hover { border-color: var(--accent); color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.primary:hover { opacity: .85; }
button.danger { border-color: var(--red); color: var(--red); }
button.danger:hover { background: var(--red); color: #fff; }
button:disabled { opacity: .35; cursor: not-allowed; }
.result { margin-top: 10px; font-size: 12px; padding: 8px 10px; border-radius: var(--radius); border: 1px solid var(--border); word-break: break-all; }
.result.hit  { border-color: var(--green); color: var(--green); background: rgba(20,241,149,.06); }
.result.miss { border-color: var(--border); color: var(--muted); }
.result.err  { border-color: var(--red); color: var(--red); background: rgba(255,68,68,.06); }
.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 1rem; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px; text-align: center; }
.stat-val { font-size: 20px; font-weight: bold; color: var(--text); }
.stat-lbl { font-size: 10px; color: var(--muted); margin-top: 2px; }
.log { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); height: 200px; overflow-y: auto; padding: 8px; font-size: 11px; line-height: 1.7; }
.l { color: var(--muted); word-break: break-all; }
.l.hit { color: var(--green); font-weight: bold; }
.l.info { color: var(--accent); }
.l.err { color: var(--red); }
.hits-box { max-height: 160px; overflow-y: auto; }
.hit-item { font-size: 11px; color: var(--green); padding: 4px 0; border-bottom: 1px solid var(--border); word-break: break-all; }
.hit-item:last-child { border-bottom: none; }
.tag { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 4px; background: rgba(153,69,255,.15); color: var(--accent); margin-left: 6px; }
.section { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 8px; }
.worker-url { font-size: 11px; color: var(--muted); margin-top: 6px; }
.worker-url span { color: var(--accent); }
</style>
</head>

<h1>◎ SOLANA PHRASE CHECKER</h1>
<div class="sub">derivasi browser · proxy via Cloudflare Worker · BIP39 + SLIP-0010 ed25519</div>

<!-- CONFIG -->
<div class="card">
  <div class="section">config</div>
  <label class="label">Cloudflare Worker URL</label>
  <input type="text" id="worker-url" placeholder="https://solana-proxy.USERNAME.workers.dev" value="">
  <div class="worker-url">belum punya worker? ikutin instruksi di <span>worker.js</span></div>
  <div class="row" style="margin-top:8px">
    <div>
      <label class="label">network</label>
      <select id="network">
        <option value="mainnet">Mainnet Beta</option>
        <option value="devnet">Devnet</option>
      </select>
    </div>
    <div>
      <label class="label">derivation path</label>
      <select id="deriv-path">
        <option value="phantom">m/44'/501'/0'/0' (Phantom)</option>
        <option value="sollet">m/501'/0'/0/0 (Sollet)</option>
        <option value="root">root seed (no path)</option>
      </select>
    </div>
  </div>
</div>

<!-- CEK MANUAL -->
<div class="card">
  <div class="section">cek phrase manual</div>
  <label class="label">seed phrase (12 atau 24 kata)</label>
  <textarea id="manual-phrase" placeholder="word1 word2 word3 ... word12"></textarea>
  <div style="margin-top:8px">
    <button class="primary" onclick="checkManual()">cek balance</button>
  </div>
  <div id="manual-result"></div>
</div>

<!-- BRUTE FORCE -->
<div class="card">
  <div class="section">brute force engine</div>
  <div class="row3" style="margin-bottom:10px">
    <div>
      <label class="label">panjang phrase</label>
      <select id="wordcount">
        <option value="12">12 kata</option>
        <option value="24">24 kata</option>
      </select>
    </div>
    <div>
      <label class="label">batch/tick</label>
      <input type="number" id="batchsize" value="2" min="1" max="10">
    </div>
    <div>
      <label class="label">delay (ms)</label>
      <input type="number" id="delay" value="400" min="100" max="5000">
    </div>
  </div>
  <div class="row">
    <button class="primary" id="startbtn" onclick="startBrute()">▶ mulai</button>
    <button class="danger" id="stopbtn" onclick="stopBrute()" disabled>■ stop</button>
  </div>
</div>

<!-- STATS -->
<div class="stats">
  <div class="stat"><div class="stat-val" id="s-tried">0</div><div class="stat-lbl">dicoba</div></div>
  <div class="stat"><div class="stat-val" id="s-hits">0</div><div class="stat-lbl">hits</div></div>
  <div class="stat"><div class="stat-val" id="s-rate">0/s</div><div class="stat-lbl">rate</div></div>
</div>

<!-- LOG -->
<div class="card" style="padding:8px">
  <div class="section">live log</div>
  <div class="log" id="logbox"></div>
</div>

<!-- HITS -->
<div class="card" id="hits-section" style="display:none;border-color:rgba(20,241,149,.3)">
  <div class="section" style="color:var(--green)">wallet ditemukan <span class="tag" id="hit-count">0</span></div>
  <div class="hits-box" id="hitsbox"></div>
</div>

/* ── SLIP-0010 ed25519 derivasi ── */
async function phraseToKeypair(phrase, pathType = "phantom") {
  const enc = new TextEncoder();
  const mnemonicKey = await crypto.subtle.importKey(
    "raw", enc.encode(phrase), {name:"PBKDF2"}, false, ["deriveBits"]
  );
  const seedBits = await crypto.subtle.deriveBits(
    {name:"PBKDF2", hash:"SHA-512", salt: enc.encode("mnemonic"), iterations: 2048},
    mnemonicKey, 512
  );
  const seed = new Uint8Array(seedBits);

  if (pathType === "root") {
    return nacl.sign.keyPair.fromSeed(seed.slice(0, 32));
  }

  const paths = {
    phantom: [0x8000002C, 0x800001F5, 0x80000000, 0x80000000],
    sollet:  [0x800001F5, 0x80000000, 0, 0],
  };

  let kL = seed.slice(0, 32);
  let kR = seed.slice(32, 64);
  const masterKey = await crypto.subtle.importKey("raw", kR, {name:"HMAC",hash:"SHA-512"}, false, ["sign"]);
  const masterI   = new Uint8Array(await crypto.subtle.sign("HMAC", masterKey, new Uint8Array([0x00, ...kL, ...new Uint8Array(4)])));

  const hmacSeed = async (key32, data) => {
    const k = await crypto.subtle.importKey("raw", key32, {name:"HMAC",hash:"SHA-512"}, false, ["sign"]);
    return new Uint8Array(await crypto.subtle.sign("HMAC", k, data));
  };

  const I = await hmacSeed(enc.encode("ed25519 seed"), seed);
  kL = I.slice(0, 32); kR = I.slice(32, 64);

  for (const idx of paths[pathType] ?? paths.phantom) {
    const data = new Uint8Array([0x00, ...kL, ...[(idx>>>24)&0xff,(idx>>>16)&0xff,(idx>>>8)&0xff,idx&0xff]]);
    const child = await hmacSeed(kR, data);
    kL = child.slice(0, 32); kR = child.slice(32, 64);
  }

  return nacl.sign.keyPair.fromSeed(kL);
}

const B58 = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
function toBase58(bytes) {
  let n = 0n;
  for (const b of bytes) n = (n << 8n) + BigInt(b);
  let r = "";
  while (n > 0n) { r = B58[Number(n % 58n)] + r; n /= 58n; }
  for (const b of bytes) { if (b !== 0) break; r = "1" + r; }
  return r;
}

/* ── RPC via Worker ── */
async function getBalance(pubkey) {
  const wurl = document.getElementById("worker-url").value.trim().replace(/\/$/, "");
  if (!wurl) throw new Error("Worker URL belum diisi");
  const net  = document.getElementById("network").value;
  const r    = await fetch(`${wurl}?net=${net}`, {
    method:  "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({jsonrpc:"2.0",id:1,method:"getBalance",params:[pubkey,{commitment:"confirmed"}]}),
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const d = await r.json();
  if (d.error) throw new Error(d.error.message);
  return d.result?.value ?? 0;
}

/* ── LOG ── */
function log(msg, cls = "l") {
  const box = document.getElementById("logbox");
  const el  = document.createElement("div");
  el.className = cls;
  el.textContent = msg;
  box.appendChild(el);
  if (box.children.length > 400) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}

/* ── CEK MANUAL ── */
async function checkManual() {
  const phrase = document.getElementById("manual-phrase").value.trim();
  const res    = document.getElementById("manual-result");
  const path   = document.getElementById("deriv-path").value;
  res.className = "result"; res.textContent = "...";

  const words = phrase.split(/\s+/);
  if (words.length !== 12 && words.length !== 24) {
    res.className = "result err";
    res.textContent = `phrase harus 12 atau 24 kata (sekarang: ${words.length})`;
    return;
  }
  try {
    res.textContent = "deriving keypair...";
    const kp     = await phraseToKeypair(phrase, path);
    const pubkey = toBase58(kp.publicKey);
    res.textContent = `pubkey: ${pubkey} — query balance...`;
    const lamps  = await getBalance(pubkey);
    const sol    = (lamps / 1e9).toFixed(9);
    if (lamps > 0) {
      res.className = "result hit";
      res.textContent = `HIT! ${sol} SOL | ${pubkey}`;
    } else {
      res.className = "result miss";
      res.textContent = `0 SOL | ${pubkey}`;
    }
  } catch(e) {
    res.className = "result err";
    res.textContent = `error: ${e.message}`;
  }
}

/* ── BRUTE FORCE ── */
let running = false, timer = null, tried = 0, hits = 0, t0 = null;

function rndPhrase(n) {
  const out = [];
  for (let i = 0; i < n; i++) out.push(W[Math.floor(Math.random() * W.length)]);
  return out.join(" ");
}

function updateStats() {
  document.getElementById("s-tried").textContent = tried.toLocaleString();
  document.getElementById("s-hits").textContent  = hits;
  const rate = t0 ? Math.round(tried / ((Date.now()-t0)/1000)) : 0;
  document.getElementById("s-rate").textContent  = rate + "/s";
}

async function bruteTick() {
  if (!running) return;
  const wc    = parseInt(document.getElementById("wordcount").value);
  const batch = Math.min(parseInt(document.getElementById("batchsize").value)||2, 10);
  const path  = document.getElementById("deriv-path").value;

  const tasks = Array.from({length: batch}, async () => {
    const phrase = rndPhrase(wc);
    try {
      const kp     = await phraseToKeypair(phrase, path);
      const pubkey = toBase58(kp.publicKey);
      log(`→ ${phrase.slice(0,50)}...`);
      const lamps  = await getBalance(pubkey);
      if (lamps > 0) return {phrase, pubkey, sol: (lamps/1e9).toFixed(9)};
    } catch(e) {
      log(`err: ${e.message}`, "l err");
    }
    return null;
  });

  tried += batch;
  const results = await Promise.allSettled(tasks);
  for (const r of results) {
    if (r.status === "fulfilled" && r.value) {
      const h = r.value; hits++;
      log(`✓ HIT: ${h.sol} SOL | ${h.pubkey} | ${h.phrase}`, "l hit");
      addHit(h);
    }
  }
  updateStats();
  const delay = parseInt(document.getElementById("delay").value)||400;
  if (running) timer = setTimeout(bruteTick, delay);
}

function addHit(h) {
  document.getElementById("hits-section").style.display = "";
  document.getElementById("hit-count").textContent = hits;
  const el = document.createElement("div");
  el.className = "hit-item";
  el.textContent = `${h.sol} SOL | ${h.pubkey} | ${h.phrase}`;
  document.getElementById("hitsbox").appendChild(el);
}

function startBrute() {
  if (running) return;
  const wurl = document.getElementById("worker-url").value.trim();
  if (!wurl) { alert("Isi Worker URL dulu!"); return; }
  running = true; tried = 0; hits = 0; t0 = Date.now();
  document.getElementById("startbtn").disabled = true;
  document.getElementById("stopbtn").disabled  = false;
  document.getElementById("logbox").innerHTML  = "";
  document.getElementById("hitsbox").innerHTML = "";
  document.getElementById("hits-section").style.display = "none";
  log("engine started — BIP39 + SLIP-0010 ed25519 aktif", "l info");
  bruteTick();
}

function stopBrute() {
  running = false; clearTimeout(timer);
  document.getElementById("startbtn").disabled = false;
  document.getElementById("stopbtn").disabled  = true;
  log(`stopped — ${tried.toLocaleString()} attempts, ${hits} hits`, "l info");
}
